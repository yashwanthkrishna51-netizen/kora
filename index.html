<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="icon" href="/favicon.ico"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#0e7490"/>
<!-- iOS "Add to Home Screen" support — iOS doesn't fully honor the web
     manifest above, so it needs its own explicit tags for a native-feeling
     standalone launch and a proper home-screen icon. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Kora"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Kora by Kognoz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=2.0.6">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-[#f5f9fa] text-gray-900">
<div id="loading-bar"></div>
<div id="loading-overlay">
  <div class="loading-overlay-card">
    <div class="loading-hourglass" aria-hidden="true">⏳</div>
    <div id="loading-overlay-text" class="loading-overlay-text">Loading…</div>
  </div>
</div>
<div id="app"></div>
<script src="/js/core.js?v=2.5.0-module-weights" defer></script>
<script src="/js/shell.js?v=2.5.0-module-weights" defer></script>
<script src="/js/dashboard.js?v=2.5.0-module-weights" defer></script>
<script src="/js/pipeline.js?v=2.5.0-module-weights" defer></script>
<script src="/js/integrations.js?v=2.5.0-module-weights" defer></script>
<script src="/js/implementation.js?v=2.5.0-module-weights" defer></script>
<script src="/js/ams.js?v=2.5.0-module-weights" defer></script>
<script src="/js/admin.js?v=2.5.0-module-weights" defer></script>
<script src="/js/modal.js?v=2.5.0-module-weights" defer></script>
<script src="/js/export.js?v=2.5.0-module-weights" defer></script>
<script src="/js/events.js?v=2.5.0-module-weights" defer></script>
<script>
  // Registers the minimal, non-caching service worker (see sw.js for why it
  // deliberately doesn't cache anything) — required for Android/Chrome to
  // consider Kora installable as a home-screen app. Guarded so any failure
  // here (unsupported browser, blocked by policy, etc.) never affects the
  // app itself — installability is a nice-to-have, not a dependency.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
