allowBuilds:
  # Declined deliberately, not left unanswered. core-js arrives transitively via
  # jspdf -> canvg -> core-js, and its postinstall is the OpenCollective
  # donation banner — it reads ADBLOCK / DISABLE_OPENCOLLECTIVE and prints to
  # the console. Nothing depends on it running.
  #
  # `pnpm add` wrote "set this to true or false" here as a placeholder. pnpm
  # treats an unresolved entry as a warning locally and as ERR_PNPM_IGNORED_BUILDS
  # on CI, so leaving it failed the Vercel build before it reached the app.
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true
